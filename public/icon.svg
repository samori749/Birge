<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Central Kyrgyz Solar Ray disc -->
  <circle cx="256" cy="230" r="90" fill="url(#sunGlow)"/>
  
  <!-- Inner Red Core -->
  <circle cx="256" cy="230" r="70" fill="#dc2626"/>
  
  <!-- 40 Rays of Kyrgyzstan Flag (simplified clean geometric rays) -->
  <g stroke="#f59e0b" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="110" x2="256" y2="135"/>
    <line x1="256" y1="325" x2="256" y2="350"/>
    <line x1="140" y1="230" x2="165" y2="230"/>
    <line x1="347" y1="230" x2="372" y2="230"/>
    
    <line x1="174" y1="148" x2="192" y2="166"/>
    <line x1="320" y1="294" x2="338" y2="312"/>
    <line x1="338" y1="148" x2="320" y2="166"/>
    <line x1="192" y1="294" x2="174" y2="312"/>
    
    <line x1="214" y1="123" x2="223" y2="146"/>
    <line x1="289" y1="314" x2="298" y2="337"/>
    <line x1="298" y1="123" x2="289" y2="146"/>
    <line x1="223" y1="314" x2="214" y2="337"/>
    
    <line x1="149" y1="188" x2="172" y2="197"/>
    <line x1="340" y1="263" x2="363" y2="272"/>
    <line x1="363" y1="188" x2="340" y2="197"/>
    <line x1="172" y1="263" x2="149" y2="272"/>
  </g>
  
  <!-- Yurt Tunduk (Crossed bars) in center -->
  <circle cx="256" cy="230" r="54" fill="none" stroke="#fbbf24" stroke-width="9"/>
  <path d="M 215,200 Q 256,215 297,200" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
  <path d="M 215,230 Q 256,245 297,230" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
  <path d="M 215,260 Q 256,275 297,260" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
  
  <path d="M 226,189 Q 241,230 226,271" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
  <path d="M 256,176 Q 256,230 256,284" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
  <path d="M 286,189 Q 271,230 286,271" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Brand text -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="4">БИРГЕ KG</text>
  <text x="256" y="455" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="20" fill="#fef08a" text-anchor="middle" letter-spacing="1">КЫРГЫЗСТАН</text>
</svg>
